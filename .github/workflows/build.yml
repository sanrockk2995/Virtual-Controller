name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore VirtualController.sln

    - name: Build solution
      shell: pwsh
      run: |
        $rawTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.4.1" }
        $semVer = $rawTag.TrimStart('v', 'V')
        dotnet build VirtualController.sln --configuration Release --no-restore -p:Version=$semVer -p:AssemblyVersion=$semVer.0 -p:FileVersion=$semVer.0

    - name: Run unit tests
      run: dotnet test tests/VirtualController.Tests/VirtualController.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish application
      shell: pwsh
      run: |
        $rawTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.4.1" }
        $semVer = $rawTag.TrimStart('v', 'V')
        dotnet publish src/VirtualController.App/VirtualController.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:Version=$semVer -p:AssemblyVersion=$semVer.0 -p:FileVersion=$semVer.0 -o dist/VirtualController
        New-Item -ItemType Directory -Path dist/VirtualController/profiles -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/config -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/logs -Force | Out-Null
        if (Test-Path "profiles") { Copy-Item -Path "profiles/*" -Destination "dist/VirtualController/profiles" -Recurse -Force }
        if (Test-Path "config") { Copy-Item -Path "config/*" -Destination "dist/VirtualController/config" -Recurse -Force }

    - name: Package Release ZIP
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.1.0" }
        $zipName = "VirtualController-$version-win-x64.zip"
        Compress-Archive -Path "dist/VirtualController/*" -DestinationPath $zipName -Force
        "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualController-win-x64
        path: ${{ env.RELEASE_ZIP }}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.RELEASE_ZIP }}
        name: VirtualController ${{ env.RELEASE_TAG }}
        tag_name: ${{ env.RELEASE_TAG }}
        body: |
          ## VirtualController ${{ env.RELEASE_TAG }}
          
          ### What's New
          - **GitHub Releases Auto-Update Checker**: Automatic update check on startup and manual check from Settings with full release notes and direct download links.
          - **Customizable Emergency Kill-Switch Hotkey**: Fully configurable global hotkey (e.g. `Ctrl + Alt + F10`, `Ctrl + Shift + F12`, `F11`...) with interactive recording in Settings.
          - **Physical Keyboard Input Blocking**: Selectively swallows mapped physical keys in games to eliminate dual-input collisions.
          - **Anti-Stuck Key Engine**: Ensures seamless key-down / key-up transitions with zero stuck keys.
          - **Safety Whitelists**: Full protection for emergency hotkey, Windows shortcuts (`Alt + Tab`, `Ctrl + Shift + Esc`), and system keys.
          - **Runtime Bilingual Localization**: Instant switching between Vietnamese 🇻🇳 and English 🇬🇧.
          - **Comprehensive Test Suite**: 71/71 unit tests passed.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
