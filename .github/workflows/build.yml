name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore VirtualController.sln

    - name: Build solution
      shell: pwsh
      run: |
        $rawTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.5.0" }
        $semVer = $rawTag.TrimStart('v', 'V')
        dotnet build VirtualController.sln --configuration Release --no-restore -p:Version=$semVer -p:AssemblyVersion=$semVer.0 -p:FileVersion=$semVer.0

    - name: Run unit tests
      run: dotnet test tests/VirtualController.Tests/VirtualController.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish application
      shell: pwsh
      run: |
        $rawTag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.5.0" }
        $semVer = $rawTag.TrimStart('v', 'V')
        dotnet publish src/VirtualController.App/VirtualController.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:Version=$semVer -p:AssemblyVersion=$semVer.0 -p:FileVersion=$semVer.0 -o dist/VirtualController
        New-Item -ItemType Directory -Path dist/VirtualController/profiles -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/config -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/logs -Force | Out-Null
        if (Test-Path "profiles") { Copy-Item -Path "profiles/*" -Destination "dist/VirtualController/profiles" -Recurse -Force }
        if (Test-Path "config") { Copy-Item -Path "config/*" -Destination "dist/VirtualController/config" -Recurse -Force }

    - name: Package Release ZIP
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.5.0" }
        $zipName = "VirtualController-$version-win-x64.zip"
        Compress-Archive -Path "dist/VirtualController/*" -DestinationPath $zipName -Force
        "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualController-win-x64
        path: ${{ env.RELEASE_ZIP }}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.RELEASE_ZIP }}
        name: VirtualController ${{ env.RELEASE_TAG }}
        tag_name: ${{ env.RELEASE_TAG }}
        body: |
          ## VirtualController ${{ env.RELEASE_TAG }}
          
          ### What's New
          - **Controller Macro & Combo Studio**: Full 125Hz deterministic macro engine supporting `Play Once`, `Repeat While Held (Turbo / Rapid Fire)`, and `Toggle Loop` execution modes.
          - **Multi-Button Combos & Stick Actions**: Combine multiple controller buttons (`LB + RB`, `X + A`) and directional stick deflections (`LS_Up`, `RS_Right`, etc.) in a single macro step with millisecond hold and delay precision.
          - **Live Macro Recorder**: Real-time macro recording that captures button press durations and inter-step delays automatically.
          - **Built-in Gaming Presets**: Instant 1-click templates for *Rapid Fire RT*, *Ultimate Skill (LB + RB)*, *Melee Combo (X -> X -> Y)*, *Dodge Roll (LS_Up + B)*, *Auto Bunny Hop*, and *Auto Sprint*.
          - **Physical Keyboard Blocking Integration**: Active macro trigger keys are automatically swallowed from games when Physical Keyboard Blocking is enabled.
          - **Comprehensive Test Suite**: 90/90 unit tests passed.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
