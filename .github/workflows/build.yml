name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore VirtualController.sln

    - name: Build solution
      run: dotnet build VirtualController.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/VirtualController.Tests/VirtualController.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish application
      shell: pwsh
      run: |
        dotnet publish src/VirtualController.App/VirtualController.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o dist/VirtualController
        New-Item -ItemType Directory -Path dist/VirtualController/profiles -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/config -Force | Out-Null
        New-Item -ItemType Directory -Path dist/VirtualController/logs -Force | Out-Null
        if (Test-Path "profiles") { Copy-Item -Path "profiles/*" -Destination "dist/VirtualController/profiles" -Recurse -Force }
        if (Test-Path "config") { Copy-Item -Path "config/*" -Destination "dist/VirtualController/config" -Recurse -Force }

    - name: Package Release ZIP
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(10) } else { "v1.1.0" }
        $zipName = "VirtualController-$version-win-x64.zip"
        Compress-Archive -Path "dist/VirtualController/*" -DestinationPath $zipName -Force
        "RELEASE_ZIP=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RELEASE_TAG=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualController-win-x64
        path: ${{ env.RELEASE_ZIP }}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.RELEASE_ZIP }}
        name: VirtualController ${{ env.RELEASE_TAG }}
        tag_name: ${{ env.RELEASE_TAG }}
        body: |
          ## VirtualController ${{ env.RELEASE_TAG }}
          
          ### What's New in v1.3.0
          - **Physical Keyboard Input Blocking (Chặn phím bàn phím vật lý)**: Eliminates dual-input collision in games by selectively swallowing mapped keys (`W, A, S, D, Space, Shift, E, Q...`) via low-level hook (`WH_KEYBOARD_LL`).
          - **Anti-Stuck Key Engine**: Precise down/up state tracking ensures no keys get stuck in-game when toggling blocking or during focus transitions.
          - **Safety Whitelists**: Full protection for emergency kill-switch (`Ctrl + Alt + F10`), Windows task navigation (`Alt + Tab`, `Ctrl + Shift + Esc`), and system keys (`LWin`, `RWin`).
          - **UI Quick-Toggle & Settings**: Added keyboard blocking toggle directly on the Dashboard and persistent configuration in Settings.
          - **Runtime Bilingual Localization**: Seamless on-the-fly switching between Vietnamese 🇻🇳 and English 🇬🇧.
          - **Advanced Mouse-to-Stick Translator**: Windows Raw Input (`WM_INPUT`), anti-deadzone, 5 response curves, radial/square geometry.
          - **Comprehensive Automated CI/CD**: 51/51 unit tests passed.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
